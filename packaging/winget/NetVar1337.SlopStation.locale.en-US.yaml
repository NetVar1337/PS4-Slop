Description: |-
  SlopStation is a Windows workbench for PS4 reverse engineering and game research. It
  speaks the ps4debug-NG wire protocol directly and runs the same analysis stack against
  local Windows processes: live memory reads and writes, Cheat Engine-style value scans,
  software breakpoints and hardware watchpoints, callstacks, remote calls, a value
  scanner with a freeze watchlist, ELF/PE/Mach-O static analysis with a decompiler and an
  x86-64 emulator, Xray obfuscation passes, patching with a journal, Lua 5.4 scripting and
  a built-in MCP server for AI agents.

  Use it only on consoles, games and systems you own or are authorized to test.
