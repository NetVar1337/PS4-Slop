[package]
name = "ps4-mcp"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "PS4-MCP: local-first PS4 reverse-engineering MCP server and toolset"
license = "GPL-3.0-only"
default-run = "ps4-mcp"

[lib]
name = "ps4_mcp"
path = "src/lib.rs"

[[bin]]
name = "ps4-mcp"
path = "src/main.rs"

# Loopback ps4debug-NG protocol fixture for installed-app (IDA/Ghidra) bridge tests.
[[bin]]
name = "ps4debug-fixture"
path = "src/bin/ps4debug_fixture.rs"
required-features = ["fixture"]

[features]
fixture = []

[dependencies]
aho-corasick = "1"
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "encoder", "block_encoder", "intel", "instr_info"] }
jsonschema = { version = "0.46", default-features = false }
md-5 = "0.10"
rand = "0.9"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rhai = { version = "1", features = ["no_module"] }
rmcp = { version = "3.8", features = ["server", "transport-io", "client", "transport-child-process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

