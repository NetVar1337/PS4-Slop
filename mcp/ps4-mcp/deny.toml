# The dependency policy for the workbench.
#
#   cargo deny check advisories bans licenses
#
# Advisories: every advisory is denied. An advisory is a known vulnerability in something we
# ship; it does not become acceptable because the dependency is convenient.
#
# Licenses: GPL-3.0-only is what this project is published under, so GPL-3.0 is allowed. The
# list is explicit so that a new license in a new dependency has to be a decision, not an
# accident.

[graph]
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "OpenSSL",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Nothing is denied by name yet. Add an entry when a specific crate has to be kept out.
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
