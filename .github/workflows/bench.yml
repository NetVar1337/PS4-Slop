name: bench

# Weekly (and on demand) benchmark run against the baselines committed in
# docs/benchmarks (see docs/benchmarks/README.md).
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      max_slowdown:
        description: 'Fail when a median exceeds baseline x this factor'
        default: '3.0'

concurrency:
  group: bench
  cancel-in-progress: false

permissions:
  contents: read

env:
  CMAKE_DISABLE_FIND_PACKAGE_PkgConfig: TRUE
  CMAKE_DISABLE_FIND_PACKAGE_Doxygen: TRUE
  SCCACHE_GHA_ENABLED: "true"

jobs:
  bench:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: cache _ext (cmake deps sources)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _ext/*-src
          key: ext-sources-v3-${{ runner.os }}-${{ hashFiles('cmake/deps.cmake') }}
          restore-keys: |
            ext-sources-v3-${{ runner.os }}-

      - name: setup node with npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: install frontend deps
        working-directory: app
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: build + run + compare
        shell: pwsh
        run: powershell -NoProfile -File tools\run_benchmarks.ps1 -MaxSlowdown ${{ github.event.inputs.max_slowdown || '3.0' }}

      - name: upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: build/bench/*.json
          if-no-files-found: warn
