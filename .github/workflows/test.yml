name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The pinned ps4debug-NG protocol fixes the debug callback port at 755;
      # allow unprivileged binds below 1024 on Linux runners so the attach
      # tests exercise the full callback path (Windows needs nothing).
      - if: runner.os == 'Linux'
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo clippy --all-targets --features fixture --locked -- -D warnings
      - run: cargo run --locked -- validate
  python:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Adapter tests talk to the real native broker binary.
      - run: cargo build --locked
      - run: python -m compileall -q ps4_workbench tests integrations
      - run: python -m unittest discover -q

  game-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y clang lld make
      - run: scripts/setup-toolchain.sh
      - run: cargo build --locked
      - run: python -m unittest -v tests.test_project_pipeline.GeneratedProjectTests tests.test_project_pipeline.GameScaffoldTests
      - run: python examples/game/build.py --host-test --engine unreal
      - run: python examples/game/build.py --engine unreal --output payload.elf
      - run: make -C examples/game host-test all
