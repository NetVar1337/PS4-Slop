name: build

on:
  push:
    branches: [main]
    # a version tag (v0.1.1 or 0.1.1) also publishes the build as a github release
    tags: ['v*', '[0-9]*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI-fast Rust: local Cargo.toml keeps lto=true + codegen-units=1 for max
  # runtime perf, CI overrides for link speed (~2-4 min saved).
  # sccache requires incremental compilation disabled in every job.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
  CARGO_PROFILE_RELEASE_LTO: false
  CARGO_PROFILE_RELEASE_STRIP: true
  CARGO_NET_RETRY: 10
  CMAKE_DISABLE_FIND_PACKAGE_PkgConfig: TRUE
  CMAKE_DISABLE_FIND_PACKAGE_Doxygen: TRUE
  SCCACHE_GHA_ENABLED: "true"

# Third-party actions are pinned to full commit SHAs (the tag is in the
# comment); Dependabot (.github/dependabot.yml) proposes bumps.
jobs:
  # Version consistency: VERSION vs package.json / tauri.conf.json / Cargo.toml
  # (and vs the tag on a release build).
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: check versions
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          ./tools/sync_version.ps1 -Check -Tag $tag

  # Path filter: a docs-only or frontend-only PR skips the C++ lanes and vice
  # versa. Push/tag/dispatch runs always execute every lane, so main and
  # releases keep the full gate; PRs get the build + tests + frontend lanes.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            cpp:
              - 'src/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'cmake/**'
              - '_ext/**'
              - 'tools/**'
              - '.github/workflows/build.yml'
            frontend:
              - 'app/**'
              - '.github/workflows/build.yml'

  # C++ engine (shipped) + the legacy ImGui shell (compile check only).
  cxx:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.cpp == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: cache _ext (cmake deps sources)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _ext/*-src
          key: ext-sources-v3-${{ runner.os }}-${{ hashFiles('cmake/deps.cmake') }}
          restore-keys: |
            ext-sources-v3-${{ runner.os }}-

      - name: build engine + ImGui shell (no tests, no frontend)
        shell: pwsh
        run: powershell -NoProfile -File tools\build.ps1 -NoFrontend -Targets "reverse-slop-engine,reverse-slop" -CmakeExtra "-DSLOP_BUILD_TESTS=OFF -DSLOP_BUILD_TEST_TARGET=OFF -DSLOP_BUILD_UI=ON"

      - name: sccache stats
        shell: pwsh
        run: sccache --show-stats || true

      - name: upload engine artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cxx-artifacts
          compression-level: 0
          path: build/src/engine/reverse-slop-engine.exe
          if-no-files-found: error

  # Every test area registered with CTest (one entry per src/tests/test_*.cpp).
  tests:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.cpp == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: cache _ext (cmake deps sources)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _ext/*-src
          key: ext-sources-v3-${{ runner.os }}-${{ hashFiles('cmake/deps.cmake') }}
          restore-keys: |
            ext-sources-v3-${{ runner.os }}-

      - name: build + run tests (ctest -L area)
        shell: pwsh
        run: powershell -NoProfile -File tools\build.ps1 -NoFrontend -Targets "slop_tests,reverse-slop-engine" -CmakeExtra "-DSLOP_BUILD_TESTS=ON -DSLOP_BUILD_TEST_TARGET=ON -DSLOP_BUILD_UI=OFF" -Test -TestLabel area

      - name: live MCP battery (spawned engine + SlopTarget)
        shell: pwsh
        run: python tools/mcp_live_test.py --results mcp_live_results.json

      - name: upload live battery results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-live-results
          path: mcp_live_results.json
          if-no-files-found: ignore

  # Same suite under MSVC AddressSanitizer (preset ninja-msvc-asan). Main,
  # tags and manual runs only: it is the slowest lane and PRs already get the
  # plain test areas.
  asan:
    needs: changes
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: cache deps sources (asan tree)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-ninja-msvc-asan/_deps/*-src
          key: asan-deps-v1-${{ runner.os }}-${{ hashFiles('cmake/deps.cmake') }}
          restore-keys: |
            asan-deps-v1-${{ runner.os }}-

      # The emu, mcp and xray areas drive the in-process Unicorn CPU emulator,
      # whose JIT execution and fault handling are incompatible with ASan (raw
      # access violations with no ASan report), so they are excluded here. xray
      # reaches the emulator through recover::recover_flattened. All three run
      # in full under the plain `tests` lane.
      - name: build + run tests with /fsanitize=address
        shell: pwsh
        run: powershell -NoProfile -File tools\build.ps1 -Preset ninja-msvc-asan -NoFrontend -Targets "slop_tests" -CmakeExtra "-DSLOP_BUILD_UI=OFF" -Test -TestLabel area -TestExclude "slop_tests_emu|slop_tests_mcp|slop_tests_xray"

      # The mcp area is the HTTP/JSON/SSE/fs/web surface; run it under ASan
      # without the Unicorn-backed emulate cases (see src/tests/CMakeLists.txt).
      - name: mcp area under ASan (minus Unicorn cases)
        shell: pwsh
        run: powershell -NoProfile -File tools\build.ps1 -Preset ninja-msvc-asan -NoFrontend -Targets "slop_tests" -CmakeExtra "-DSLOP_BUILD_UI=OFF" -Test -TestLabel mcpnoemu

  # MSVC /analyze over first-party code (preset ninja-msvc-analyze). Findings
  # are listed in the run summary. Main, tags and manual runs only.
  analyze:
    needs: changes
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: cache deps sources (analyze tree)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-ninja-msvc-analyze/_deps/*-src
          key: analyze-deps-v1-${{ runner.os }}-${{ hashFiles('cmake/deps.cmake') }}
          restore-keys: |
            analyze-deps-v1-${{ runner.os }}-

      - name: build with /analyze
        shell: pwsh
        run: powershell -NoProfile -File tools\build.ps1 -Preset ninja-msvc-analyze -NoFrontend -Targets "reverse-slop-engine,slop_tests,reverse-slop" *>&1 | Tee-Object -FilePath analyze.log

      - name: summarize /analyze findings
        if: always()
        shell: pwsh
        run: |
          $hits = @()
          if (Test-Path -LiteralPath analyze.log) {
            $hits = @(Select-String -LiteralPath analyze.log -Pattern 'warning C(6|26|28)\d{3}' |
              ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique)
          }
          "### MSVC /analyze: $($hits.Count) unique findings" | Add-Content $env:GITHUB_STEP_SUMMARY
          if ($hits) {
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
            $hits | Select-Object -First 200 | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          }

  # clang-tidy (.clang-tidy) over first-party code via compile_commands.json.
  # Main, tags and manual runs only.
  clang-tidy:
    needs: changes
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: cache _ext (cmake deps sources)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _ext/*-src
          key: ext-sources-v3-${{ runner.os }}-${{ hashFiles('cmake/deps.cmake') }}
          restore-keys: |
            ext-sources-v3-${{ runner.os }}-

      - name: configure (compile_commands.json)
        shell: pwsh
        run: powershell -NoProfile -File tools\build.ps1 -NoFrontend -PlanOnly

      - name: clang-tidy
        shell: pwsh
        run: ./tools/clang_tidy.ps1 -Jobs 4

  # Compile the real frontend immediately, independently of native sidecars.
  # Tests live in their own parallel ubuntu lane; this job only compiles.
  frontend-build:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: sccache (rustc wrapper)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: setup node with npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: rust cache (target/ + registry)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri -> target
          cache-on-failure: true
          shared-key: frontend-release-v2

      - name: cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/node_modules
          key: node-v2-${{ runner.os }}-22-${{ hashFiles('app/package-lock.json') }}

      - name: compile frontend (no sidecars, no installer, no tests)
        shell: pwsh
        run: ./tools/build_frontend_binary.ps1 -SkipTests

      - name: sccache stats
        if: always()
        shell: pwsh
        run: sccache --show-stats

      - name: upload frontend binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-binary
          compression-level: 0
          path: app/src-tauri/target/release/reverse-slop-ui.exe
          if-no-files-found: error

  # Frontend unit tests on linux: pure node/vite, no windows toolchain needed,
  # fully parallel with every compile lane.
  frontend-tests:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: setup node with npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: run frontend tests
        working-directory: app
        run: npm ci --prefer-offline --no-audit --no-fund && npm test

  # Packaging: no Rust or C++ compilation on this job's critical path.
  # Signs the binaries and the installer when signing secrets are configured,
  # and always publishes SHA256SUMS next to the artifacts.
  bundle:
    runs-on: windows-2022
    timeout-minutes: 30
    needs: [changes, cxx, frontend-build]
    # Packaging is the release gate: main, tags and manual runs. PRs validate
    # the engine and the frontend in their own lanes.
    if: github.event_name != 'pull_request'
    env:
      # secrets are not usable in step `if:`; expose presence as a flag
      SIGNING_ENABLED: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && secrets.AZURE_SIGNING_ENDPOINT != '' && secrets.AZURE_SIGNING_ACCOUNT != '' && secrets.AZURE_SIGNING_PROFILE != '' }}
      # Tauri updater signing: build.ps1 turns on createUpdaterArtifacts when
      # this is set, and the installer .sig lands next to the setup exe.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: setup node with npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: cache node_modules (exact lockfile only)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/node_modules
          key: node-v2-${{ runner.os }}-22-${{ hashFiles('app/package-lock.json') }}

      - name: cache tauri bundler tooling (NSIS)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\tauri\NSIS
          key: tauri-nsis-v1

      - name: download frontend binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-binary
          path: app/src-tauri/target/release

      - name: cache magicmida (unpacker zips)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/reverse-slop/tools/magicmida
          key: magicmida-${{ hashFiles('tools/magicmida-version.txt') }}

      - name: download cxx artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cxx-artifacts
          path: _staging/cxx

      - name: stage build tree for tauri resource map
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/src/engine | Out-Null
          # upload-artifact preserves subdirs (build/...) on some versions and
          # flattens on others: search recursively so both layouts work.
          $f = @(Get-ChildItem -Path _staging/cxx -Recurse -Filter 'reverse-slop-engine.exe' -File)
          if ($f.Count -ne 1) { throw "expected exactly one staged reverse-slop-engine.exe, found $($f.Count)" }
          Copy-Item -LiteralPath $f[0].FullName -Destination build/src/engine/reverse-slop-engine.exe -Force
          Get-ChildItem build/src/engine

      - name: sign engine
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\build\src\engine\reverse-slop-engine.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: embed the engine into the app exe (single-file portable)
        shell: pwsh
        run: |
          $app = 'app/src-tauri/target/release/reverse-slop-ui.exe'
          $eng = 'build/src/engine/reverse-slop-engine.exe'
          $bytes = [IO.File]::ReadAllBytes($eng)
          $appLen = (Get-Item -LiteralPath $app).Length
          $fs = [IO.File]::Open($app, 'Append')
          try {
            $fs.Write($bytes, 0, $bytes.Length)
            $bw = [IO.BinaryWriter]::new($fs)
            $bw.Write([Text.Encoding]::ASCII.GetBytes('SLOPENG1'))
            $bw.Write([uint64]$appLen)
            $bw.Write([uint64]$bytes.Length)
            $bw.Flush()
          } finally { $fs.Close() }
          Write-Host "embedded $($bytes.Length) engine bytes at offset $appLen"

      - name: sign frontend binary
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\app\src-tauri\target\release\reverse-slop-ui.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: bundle precompiled frontend and native artifacts
        shell: pwsh
        run: powershell -NoProfile -File tools\build.ps1 -FrontendOnly -BundleOnly -FastBundle -Full -OnlineWebview

      - name: resolve the installer
        id: setup
        shell: pwsh
        run: |
          # exactly one fresh installer: a stale second *-setup.exe is an error,
          # never a silent pick
          $version = (Get-Content VERSION -TotalCount 1).Trim()
          $all = @(Get-ChildItem app/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' -File)
          $match = @($all | Where-Object Name -Like "*_${version}_*")
          if ($match.Count -ne 1) { throw "expected one installer for $version, found: $($all.Name -join ', ')" }
          "path=$($match[0].FullName)" >> $env:GITHUB_OUTPUT
          $sig = "$($match[0].FullName).sig"
          if (Test-Path -LiteralPath $sig) {
            "sig=$sig" >> $env:GITHUB_OUTPUT
          } elseif ($env:GITHUB_REF_TYPE -eq 'tag') {
            throw "updater signature missing on a tag build: $sig (set TAURI_SIGNING_PRIVATE_KEY)"
          } else {
            Write-Host "no updater signature (signing key not set)"
          }

      - name: sign the installer
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files: ${{ steps.setup.outputs.path }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: verify signatures
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          foreach ($f in @('dist/reverse-slop/reverse-slop.exe', 'build/src/engine/reverse-slop-engine.exe', '${{ steps.setup.outputs.path }}')) {
            $sig = Get-AuthenticodeSignature -LiteralPath $f
            if ($sig.Status -ne 'Valid') { throw "$f signature status: $($sig.Status)" }
            Write-Host "signed: $f ($($sig.SignerCertificate.Subject))"
          }

      - name: release files + SHA256SUMS
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force -Path _release
          $ref = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "$((Get-Content VERSION -TotalCount 1).Trim())-$($env:GITHUB_SHA.Substring(0, 8))" }
          Compress-Archive -Path dist/reverse-slop -DestinationPath (Join-Path $out "reverse-slop-portable-$ref.zip")
          Copy-Item -LiteralPath '${{ steps.setup.outputs.path }}' -Destination $out
          if ('${{ steps.setup.outputs.sig }}' -ne '') {
            Copy-Item -LiteralPath '${{ steps.setup.outputs.sig }}' -Destination $out
          }
          Push-Location $out
          Get-ChildItem -File | Where-Object Name -NE 'SHA256SUMS' | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -LiteralPath SHA256SUMS -Encoding ascii
          Get-Content SHA256SUMS
          Pop-Location

      - name: upload the portable app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reverse-slop-portable
          compression-level: 0
          path: |
            dist/reverse-slop/reverse-slop.exe
            dist/reverse-slop/LICENSE.txt
            dist/reverse-slop/THIRD_PARTY_NOTICES.md
          if-no-files-found: error

      - name: upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reverse-slop-setup
          compression-level: 0
          path: ${{ steps.setup.outputs.path }}
          if-no-files-found: error

      - name: upload release files (zip, installer, SHA256SUMS)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reverse-slop-release
          compression-level: 0
          path: _release/*
          if-no-files-found: error

  # A tag build publishes only after every lane passed: builds, all test
  # areas (plain + ASan), static analysis, frontend tests, version check.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [version, cxx, tests, asan, analyze, clang-tidy, frontend-build, frontend-tests, bundle]
    permissions:
      # write so a tag build can publish its release
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reverse-slop-release
          path: _release

      - name: verify SHA256SUMS
        working-directory: _release
        run: sha256sum --check --strict SHA256SUMS

      - name: publish the github release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # release notes: this version's CHANGELOG.md section (required), then
          # GitHub's generated commit/PR list
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on && /^\[[^]]*\]: / { exit }
            on { print }' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no entry for [$version]" >&2
            exit 1
          fi
          # updater manifest: the Tauri updater reads this from the latest
          # release and verifies the installer against the embedded public key
          setup=$(cd _release && ls *-setup.exe | head -1)
          sig=$(cat "_release/${setup}.sig")
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${setup}"
          jq -n --arg v "$version" --arg notes "$(cat notes.md)" \
                --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg sig "$sig" --arg url "$url" \
            '{version:$v, notes:$notes, pub_date:$date,
              platforms:{"windows-x86_64":{signature:$sig, url:$url}}}' \
            > _release/latest.json
          cat _release/latest.json
          # first run on a tag creates the release, a rerun or a manual dispatch
          # on the same tag just replaces its assets
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --generate-notes --verify-tag
          fi
          gh release upload "$TAG" _release/* --clobber
