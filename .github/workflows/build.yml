name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Full static analysis + ASan + the whole suite run nightly, off the
  # push/PR critical path.
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI-fast Rust: local Cargo.toml keeps lto=true + codegen-units=1 for max
  # runtime perf, CI overrides for link speed (~2-4 min saved).
  # sccache requires incremental compilation disabled in every job.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
  CARGO_PROFILE_RELEASE_LTO: false
  CARGO_PROFILE_RELEASE_STRIP: true
  CARGO_NET_RETRY: 10
  CMAKE_DISABLE_FIND_PACKAGE_PkgConfig: TRUE
  CMAKE_DISABLE_FIND_PACKAGE_Doxygen: TRUE
  SCCACHE_GHA_ENABLED: "true"

# Third-party actions are pinned to full commit SHAs (the tag is in the
# comment); Dependabot (.github/dependabot.yml) proposes bumps.
jobs:
  # Version consistency: VERSION vs package.json / tauri.conf.json / Cargo.toml
  # (and vs the tag on a release build).
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: check versions
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          ./tools/sync_version.ps1 -Check -Tag $tag
      - name: lint workflows (.yamllint.yml)
        run: pipx run yamllint==1.37.1 --strict .github .yamllint.yml

  # Path filter: a docs-only or frontend-only PR skips the C++ lanes and vice
  # versa. Push/tag/dispatch runs always execute every lane, so main and
  # releases keep the full gate; PRs get the build + tests + frontend lanes.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            cpp:
              - 'src/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'cmake/**'
              - '_ext/**'
              - 'tools/**'
              - '.github/workflows/build.yml'
            frontend:
              - 'app/**'
              - '.github/workflows/build.yml'

  # A PR that changes shipped code must say what changed: CHANGELOG.md gets an
  # Unreleased entry, unless the PR carries the `no-changelog` label (docs,
  # CI-only or dependency-only changes).
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: require a CHANGELOG.md entry
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [[ ",$LABELS," == *",no-changelog,"* ]]; then
            echo "skipped: the no-changelog label is set"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          if ! grep -qE '^(src|app/src)/' <<<"$changed"; then
            echo "no shipped code changed"
            exit 0
          fi
          if ! grep -qx 'CHANGELOG.md' <<<"$changed"; then
            echo "::error::this PR changes shipped code but not CHANGELOG.md; add an Unreleased entry or the no-changelog label"
            exit 1
          fi
          echo "CHANGELOG.md updated"

  # Secret scanning (gitleaks, config in .gitleaks.toml) on every PR and on
  # main. The action scans the PR's commit range, or the push range on main.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # the action comments its findings on the PR (the workflow default is
    # contents: read only)
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # GITLEAKS_LICENSE is only needed for organization-owned repositories;
      # the action runs unlicensed on a personal/public repository.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # Every test area registered with CTest (one entry per src/tests/test_*.cpp),
  # plus the shipped engine artifact and the legacy ImGui shell compile check.
  tests:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.cpp == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      # the slowest healthy case is ~7 s; a hang should cost 30 s, not 300 s
      SLOP_TEST_TIMEOUT_SEC: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: cache _ext (cmake deps sources)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _ext/*-src
          key: ext-sources-v3-${{ runner.os }}-${{ hashFiles('cmake/deps.cmake') }}
          restore-keys: |
            ext-sources-v3-${{ runner.os }}-

      - name: build + run tests (ctest -L area)
        shell: pwsh
        run: powershell -NoProfile -File tools\build.ps1 -NoFrontend -Targets "slop_tests,reverse-slop-engine,reverse-slop" -CmakeExtra "-DSLOP_BUILD_TESTS=ON -DSLOP_BUILD_TEST_TARGET=ON -DSLOP_BUILD_UI=ON" -Test -TestLabel area

      - name: upload engine artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cxx-artifacts
          compression-level: 0
          path: build/src/engine/reverse-slop-engine.exe
          if-no-files-found: error

      - name: live MCP battery (spawned engine + SlopTarget)
        shell: pwsh
        run: python tools/mcp_live_test.py --results mcp_live_results.json

      # every (tool, action, param) the UI sends vs the engine's tools/list
      - name: frontend/engine API contract
        shell: pwsh
        run: ./tools/check_api.ps1

      - name: MCP over stdio (--stdio)
        shell: pwsh
        run: python tools/mcp_stdio_test.py

      - name: upload live battery results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-live-results
          path: mcp_live_results.json
          if-no-files-found: ignore

      # Nightly e2e smoke against the engine + SlopTarget this job just built
      # (was a separate workflow that rebuilt the whole tree).
      - name: setup node (e2e)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/e2e/package-lock.json

      - name: e2e smoke (engine + SlopTarget over /api)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          npm --prefix app/e2e ci --prefer-offline --no-audit --no-fund
          npm --prefix app/e2e run smoke

  # Same suite under MSVC AddressSanitizer (preset ninja-msvc-asan). Main,
  # tags and manual runs only: it is the slowest lane and PRs already get the
  # plain test areas.
  asan:
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: cache deps sources (asan tree)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-ninja-msvc-asan/_deps/*-src
          key: asan-deps-v1-${{ runner.os }}-${{ hashFiles('cmake/deps.cmake') }}
          restore-keys: |
            asan-deps-v1-${{ runner.os }}-

      # The emu, mcp and xray areas drive the in-process Unicorn CPU emulator,
      # whose JIT execution and fault handling are incompatible with ASan (raw
      # access violations with no ASan report), so they are excluded here. xray
      # reaches the emulator through recover::recover_flattened. All three run
      # in full under the plain `tests` lane.
      - name: build + run tests with /fsanitize=address
        shell: pwsh
        run: powershell -NoProfile -File tools\build.ps1 -Preset ninja-msvc-asan -NoFrontend -Targets "slop_tests" -CmakeExtra "-DSLOP_BUILD_UI=OFF" -Test -TestLabel area -TestExclude "slop_tests_emu|slop_tests_mcp|slop_tests_xray"

      # The mcp area is the HTTP/JSON/SSE/fs/web surface; run it under ASan
      # without the Unicorn-backed emulate cases (see src/tests/CMakeLists.txt).
      - name: mcp area under ASan (minus Unicorn cases)
        shell: pwsh
        run: powershell -NoProfile -File tools\build.ps1 -Preset ninja-msvc-asan -NoFrontend -Targets "slop_tests" -CmakeExtra "-DSLOP_BUILD_UI=OFF" -Test -TestLabel mcpnoemu

  # MSVC /analyze over first-party code (preset ninja-msvc-analyze). Findings
  # are listed in the run summary. Main, tags and manual runs only.
  analyze:
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: cache deps sources (analyze tree)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-ninja-msvc-analyze/_deps/*-src
          key: analyze-deps-v1-${{ runner.os }}-${{ hashFiles('cmake/deps.cmake') }}
          restore-keys: |
            analyze-deps-v1-${{ runner.os }}-

      - name: build with /analyze
        shell: pwsh
        run: powershell -NoProfile -File tools\build.ps1 -Preset ninja-msvc-analyze -NoFrontend -Targets "reverse-slop-engine,slop_tests,reverse-slop" *>&1 | Tee-Object -FilePath analyze.log

      - name: summarize /analyze findings
        if: always()
        shell: pwsh
        run: |
          $hits = @()
          if (Test-Path -LiteralPath analyze.log) {
            $hits = @(Select-String -LiteralPath analyze.log -Pattern 'warning C(6|26|28)\d{3}' |
              ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique)
          }
          "### MSVC /analyze: $($hits.Count) unique findings" | Add-Content $env:GITHUB_STEP_SUMMARY
          if ($hits) {
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
            $hits | Select-Object -First 200 | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      # Ratchet: a finding that is not in docs/analyze-baseline.txt fails the
      # lane (the standing backlog is accepted, new defects are not).
      - name: /analyze ratchet (fail on new findings)
        shell: pwsh
        run: ./tools/analyze_ratchet.ps1 -Log analyze.log

  # libFuzzer targets (src/fuzz, preset ninja-msvc-fuzz) over the parsers that
  # consume untrusted input. Nightly and manual: each target runs for the
  # configured time, and a crash fails the lane with the reproducer uploaded.
  fuzz:
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: cache deps sources (fuzz tree)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-ninja-msvc-fuzz/_deps/*-src
          key: fuzz-deps-v1-${{ runner.os }}-${{ hashFiles('cmake/deps.cmake') }}
          restore-keys: |
            fuzz-deps-v1-${{ runner.os }}-

      - name: build the fuzz targets
        shell: pwsh
        run: powershell -NoProfile -File tools\build.ps1 -Preset ninja-msvc-fuzz -NoFrontend -Targets "fuzz_elf,fuzz_pe,fuzz_macho,fuzz_ipa,fuzz_zip,fuzz_ps4,fuzz_dotnet"

      - name: run every fuzzer (60 s each)
        shell: pwsh
        run: ./tools/run_fuzzers.ps1 -Preset ninja-msvc-fuzz -Seconds 60 -ArtifactDir fuzz-artifacts

      - name: upload crash reproducers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: fuzz-artifacts
          if-no-files-found: ignore

  # CodeQL: C++ traced through a real build (no sccache: it hides the
  # compiler from the tracer), TypeScript and the workflows themselves.
  # Nightly and manual only.
  codeql:
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            os: windows-2022
            build-mode: manual
          - language: javascript-typescript
            os: ubuntu-latest
            build-mode: none
          - language: actions
            os: ubuntu-latest
            build-mode: none
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: cache _ext (cmake deps sources)
        if: matrix.language == 'c-cpp'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _ext/*-src
          key: ext-sources-v3-${{ runner.os }}-${{ hashFiles('cmake/deps.cmake') }}
          restore-keys: |
            ext-sources-v3-${{ runner.os }}-

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: |
            paths-ignore: [_ext, external, app/node_modules]

      - name: build (traced)
        if: matrix.language == 'c-cpp'
        shell: pwsh
        run: powershell -NoProfile -File tools\build.ps1 -NoFrontend -Targets "reverse-slop-engine,slop_tests,reverse-slop"

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  # Line coverage of the C++ suite (OpenCppCoverage over a Debug build), as
  # a Cobertura artifact plus a total in the run summary. Nightly and manual.
  coverage:
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.changes.outputs.cpp == 'true')
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: cache deps sources (debug tree)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-ninja-msvc-debug/_deps/*-src
          key: debug-deps-v1-${{ runner.os }}-${{ hashFiles('cmake/deps.cmake') }}
          restore-keys: |
            debug-deps-v1-${{ runner.os }}-

      - name: install OpenCppCoverage 0.9.9.0 (hash-pinned)
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\occ.exe"
          Invoke-WebRequest https://github.com/OpenCppCoverage/OpenCppCoverage/releases/download/release-0.9.9.0/OpenCppCoverageSetup-x64-0.9.9.0.exe -OutFile $exe
          $h = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($h -ne '2295A733DA39412C61E4F478677519DD0BB1893D88313CE56B468C9E50517888') { throw "OpenCppCoverage hash $h" }
          Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          "C:\Program Files\OpenCppCoverage" >> $env:GITHUB_PATH

      - name: build (Debug, PDBs)
        shell: pwsh
        run: powershell -NoProfile -File tools\build.ps1 -Preset ninja-msvc-debug -NoFrontend -Targets "slop_tests" -CmakeExtra "-DSLOP_BUILD_UI=OFF"

      - name: run the suite under coverage
        shell: pwsh
        env:
          SLOP_TEST_TIMEOUT_SEC: 600
        run: |
          OpenCppCoverage --quiet --sources "$PWD\src" --excluded_sources "$PWD\src	ests" `
            --export_type "cobertura:coverage.xml" -- build-ninja-msvc-debug	ests\slop_tests.exe
          [xml]$c = Get-Content coverage.xml
          $pct = [math]::Round([double]$c.coverage.'line-rate' * 100, 1)
          "### C++ line coverage: $pct% (src/, tests excluded)" | Add-Content $env:GITHUB_STEP_SUMMARY

      # Ratchet: fails when src/core line coverage drops more than 0.5 points
      # below docs/coverage-baseline.txt (re-baseline with -Update).
      - name: coverage ratchet (src/core)
        shell: pwsh
        run: ./tools/coverage_ratchet.ps1 -Cobertura coverage.xml

      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-cobertura
          path: coverage.xml
          if-no-files-found: warn

  # clang-tidy (.clang-tidy) over first-party code via compile_commands.json.
  # Main, tags and manual runs only.
  clang-tidy:
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: cache _ext (cmake deps sources)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _ext/*-src
          key: ext-sources-v3-${{ runner.os }}-${{ hashFiles('cmake/deps.cmake') }}
          restore-keys: |
            ext-sources-v3-${{ runner.os }}-

      - name: configure (compile_commands.json)
        shell: pwsh
        run: powershell -NoProfile -File tools\build.ps1 -NoFrontend -PlanOnly

      - name: clang-tidy
        shell: pwsh
        run: ./tools/clang_tidy.ps1 -Jobs 4

  # Compile the real frontend immediately, independently of native sidecars.
  # Tests live in their own parallel ubuntu lane; this job only compiles.
  frontend-build:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true' || contains(github.event.pull_request.labels.*.name, 'ci:package')
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: sccache (rustc wrapper)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: setup node with npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: rust cache (target/ + registry)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri -> target
          cache-on-failure: true
          shared-key: frontend-release-v2

      - name: cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/node_modules
          key: node-v2-${{ runner.os }}-22-${{ hashFiles('app/package-lock.json') }}

      - name: compile frontend (no sidecars, no installer, no tests)
        shell: pwsh
        run: ./tools/build_frontend_binary.ps1 -SkipTests

      - name: sccache stats
        if: always()
        shell: pwsh
        run: sccache --show-stats

      - name: upload frontend binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-binary
          compression-level: 0
          path: app/src-tauri/target/release/reverse-slop-ui.exe
          if-no-files-found: error

  # Frontend unit tests on linux: pure node/vite, no windows toolchain needed,
  # fully parallel with every compile lane.
  frontend-tests:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: setup node with npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: install
        working-directory: app
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: lint + format
        working-directory: app
        run: npm run lint && npm run format:check

      - name: run frontend tests
        working-directory: app
        run: npm test
