name: Bug report
description: Something in reverse-slop does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems: do NOT file them here, see SECURITY.md (private vulnerability reporting).
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit (Settings / `VERSION` file)
      placeholder: v0.1.1
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - PS4 console connection / ps4debug
        - Memory / scanner / watchlist
        - Debugger
        - Static analysis / decompiler / loaders (ELF, SELF, PE, Mach-O)
        - Emulator / Lua scripting
        - Network capture / proxy / web
        - MCP server / API
        - Tauri front end
        - Legacy ImGui shell
        - Build / installer / CI
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include console firmware, target binary/format and MCP calls if relevant.
      placeholder: |
        1. Connect to console (fw 11.00)
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output panel / engine log excerpt (redact tokens).
      render: text
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
