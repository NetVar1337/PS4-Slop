name: Feature request
description: Suggest a new capability or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that reverse-slop does not support well today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: UI, MCP tool/action or Lua API shape you have in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
