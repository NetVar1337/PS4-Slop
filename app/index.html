<!doctype html>
<html lang="en" data-theme="obsidian">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- No remote origins: everything ships in the bundle, and the only
         network target is the loopback engine. Source of truth is
         src-tauri/tauri.conf.json app.security.csp; this copy serves plain
         browser dev, and src-tauri/build.rs fails the build if they drift. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; connect-src 'self' http://127.0.0.1:* http://localhost:* ipc: http://ipc.localhost"
    />
    <title>SlopStation</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
